name: Quality checks
on:
  push:
    branches: [gh-pages, "improve/**"]
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
